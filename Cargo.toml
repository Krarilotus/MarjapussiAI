[workspace]
resolver = "2"
members = ["crates/engine", "crates/observation", "crates/knowledge"]

[workspace.package]
edition = "2021"
license = "GPL-3.0"
repository = "local: Documents/MarjaAI/MarjapussiAI"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
