[package]
name = "marjapussi-engine"
version = "0.1.0"
description = "Marjapussi rules engine (single owner of the game rules)."
authors = ["Samuel Leßmann <samuel@lessmann.dev>", "Krarilotus"]
edition.workspace = true
license.workspace = true

[dependencies]
itertools = "0.14.0"
strum = "0.27.1"
strum_macros = "0.27.1"
chrono = "0.4.40"
rand = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3.12.0"
