[package]
name = "marjapussi-tools"
version = "0.1.0"
description = "Command-line drivers: arena (over crates/eval), human_eval (the human games), perf (the decision guard); legacy replay and game records."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
engine = { package = "marjapussi-engine", path = "../engine" }
observation = { package = "marjapussi-observation", path = "../observation" }
knowledge = { package = "marjapussi-knowledge", path = "../knowledge" }
beliefs = { package = "marjapussi-beliefs", path = "../beliefs" }
heuristic = { package = "marjapussi-heuristic", path = "../heuristic" }
agent = { package = "marjapussi-agent", path = "../agent" }
eval = { package = "marjapussi-eval", path = "../eval" }
serde_json = "1"

[lib]
name = "tools"

# These drivers have no unit tests; integration tests exercise their shared library.
[[bin]]
name = "branchdiff"
test = false
bench = false

[[bin]]
name = "exchangediag"
test = false
bench = false

[[bin]]
name = "arena"
test = false
bench = false

[[bin]]
name = "audit"
test = false
bench = false

[[bin]]
name = "beliefs_study"
test = false
bench = false

[[bin]]
name = "human_eval"
test = false
bench = false

[[bin]]
name = "mind_profile"
test = false
bench = false

[[bin]]
name = "perf"
test = false
bench = false

[[bin]]
name = "study"
test = false
bench = false

[[bin]]
name = "replaydiff"
test = false
bench = false

[[bin]]
name = "selfplay"
test = false
bench = false

[features]
profile = ["heuristic/profile", "beliefs/profile"]

